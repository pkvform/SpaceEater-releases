# Publishes a GitHub Release when a branch named release/v1.2.3 is pushed.
# That branch's commit carries SpaceEater.exe, SpaceEater.exe.sha256 and release-notes.md;
# the main branch never contains the executable. After the release (and its tag) is created,
# the branch is deleted: the tag keeps the commit.
name: Release

on:
  push:
    branches: ["release/v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify checksum
        run: sha256sum -c SpaceEater.exe.sha256
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          TAG="${BRANCH#release/}"
          gh release create "$TAG" SpaceEater.exe SpaceEater.exe.sha256 \
            --target "$GITHUB_SHA" \
            --title "SpaceEater ${TAG#v}" \
            --notes-file release-notes.md
      - name: Remove release branch
        run: git push origin --delete "${{ github.ref_name }}"
